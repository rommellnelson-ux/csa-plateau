<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Tests CSA Plateau</title>
<style>
  body{font-family:system-ui,Arial,sans-serif;padding:18px;color:#1a1a2e;max-width:760px;margin:0 auto}
  h1{font-size:18px}
  #sum{font-size:18px;font-weight:700;margin:12px 0;padding:10px;border-radius:8px}
  #sum.pass{background:#e8f5e9;color:#1a6b3c}
  #sum.fail{background:#fbeaea;color:#8b1a1a}
  ul{list-style:none;padding:0}
  li{margin:3px 0;font-size:13px}
  li.pass{color:#1a6b3c}
  li.fail{color:#8b1a1a;font-weight:700}
  .muted{color:#667084;font-size:12px}
</style>
</head>
<body>
<h1>Tests automatiques — CSA Plateau</h1>
<p class="muted">Charge <code>index.html</code> dans un cadre masqué et exécute des assertions sur les fonctions réelles, dans le contexte de l'application. Aucune donnée n'est écrite dans le cloud (localStorage du cadre uniquement, nettoyé).</p>
<div id="sum">Chargement de l'application…</div>
<ul id="list"></ul>
<iframe id="app" src="index.html" style="width:0;height:0;border:0;position:absolute;left:-9999px"></iframe>
<script>
// Le corps des tests s'exécute DANS le contexte de l'iframe (eval) pour voir
// les const (escHtml, VIEW, ...) qui ne sont pas exposées sur window.
const TEST_SRC = `(async function(){
  const results=[];
  const ok=(name,cond)=>results.push({name,pass:!!cond});
  try{
    ok('numFR accepte la virgule (72,5)', numFR('72,5')===72.5);
    ok('numFR vide = 0', numFR('')===0);
    ok('tailleCm metres 1,75 -> 175', tailleCm('1,75')===175);
    ok('tailleCm cm 175 -> 175', tailleCm('175')===175);
    ok('tailleCm point 1.75 -> 175', tailleCm('1.75')===175);
    ok('EAN valide accepte', isValidEan('5901234123457')===true);
    ok('EAN mauvaise cle rejete', isValidEan('5901234123450')===false);
    ok('EAN vide accepte', isValidEan('')===true);
    ok('escHtml neutralise <', escHtml('<img onerror=x>').indexOf('<')===-1);
    ok('escSQ est une fonction', typeof escSQ==='function');
    ok('encaissement arrondi entier', Math.round(3*2.5)===8);
    const si=sevciIndic();
    ok('sevciIndic renvoie une structure', si && typeof si.total==='number' && typeof si.pctSupp==='number');

    CURRENT_AGENT={id:'M',nom:'M',module:'sevci',permissions:['sevci_data'],isChef:false};
    const tabs=getAllowedTabs();
    ok('sevci voit la file active', tabs.includes('sevci-file'));
    ok('sevci NE voit PAS la pharmacie', !tabs.includes('pha-stock'));
    ok('sevci NE voit PAS la compta', !tabs.includes('cpt-caisse'));

    CURRENT_AGENT={id:'T',nom:'T',module:'chef',permissions:['chef'],isChef:true};
    let rendered=0; const rerr=[];
    Object.keys(VIEW).forEach(k=>{ const d=document.createElement('div'); try{VIEW[k](d);rendered++;}catch(e){rerr.push(k);} });
    ok('toutes les vues rendent ('+rendered+'/'+Object.keys(VIEW).length+')'+(rerr.length?' KO:'+rerr.join(','):''), rerr.length===0);

    localStorage.setItem('csa2_patients', JSON.stringify([{id:'x',nom:'<img src=x onerror=alert(1)>',genre:'M',statut:'NA',created_at:new Date().toISOString()}]));
    const dd=document.createElement('div'); try{VIEW['chef-patients'](dd);}catch(e){}
    ok('XSS nom patient echappe', dd.innerHTML.indexOf('<img src=x onerror')===-1);
    localStorage.removeItem('csa2_patients');

    // ─── Règle prix pharmacie (commit 957f313/1411238) : produit sans tarif validé ───
    ok('needsPriceValidation: px_cession 0 -> a valider', needsPriceValidation({px_cession:0})===true);
    ok('needsPriceValidation: prix positif -> ok', needsPriceValidation({px_cession:500})===false);
    ok('needsPriceValidation: A_VALIDER force malgre prix', needsPriceValidation({px_cession:500,price_status:'A_VALIDER'})===true);
    ok('needsPriceValidation: produit cree sans prix (hors chef) -> a valider', needsPriceValidation({})===true);

    // ─── Régression MFA : contrat de retour de listFactors() ───
    // Vérifié sur supabase-js 2.110.8 : data.totp ne contient QUE les facteurs vérifiés ;
    // un facteur inachevé n'existe que dans data.all. Chercher un facteur non vérifié
    // dans data.totp donne toujours l'ensemble vide (défaut corrigé).
    const fxMfa={
      all:[{id:'f1',status:'unverified',factor_type:'totp'},{id:'f2',status:'verified',factor_type:'totp'}],
      totp:[{id:'f2',status:'verified',factor_type:'totp'}]
    };
    ok('contrat: facteur inacheve present dans data.all', fxMfa.all.some(f=>f.status!=='verified'));
    ok('contrat: facteur inacheve ABSENT de data.totp', !fxMfa.totp.some(f=>f.status!=='verified'));
    ok('ancienne methode (.totp) ne detectait rien', fxMfa.totp.filter(f=>f.status!=='verified').length===0);
    ok('methode corrigee (.all) detecte 1 inacheve', fxMfa.all.filter(f=>f.status!=='verified').length===1);
    ok('source unique des facteurs definie', typeof listerTousLesFacteursMfa==='function');
    ok('bootstrap Auth unique defini', typeof bootstrapAuthenticatedSession==='function');
    ok('verrous reinitialisables', typeof resetAuthLocks==='function');
    ok('reprise et redemarrage exposes', typeof mfaReprendre==='function' && typeof mfaRecommencer==='function');
    ok('machine d etats MFA complete (10 etats)', typeof MFA_ETATS==='object' && Object.keys(MFA_ETATS).length===10);
    ok('libelle SEV-CI principal', libelleFacteurMfa({isChef:false,permissions:['sevci_data']},'principal')==='CSA Plateau - SEV-CI principal');
    ok('libelle SEV-CI secours', libelleFacteurMfa({isChef:false,permissions:['sevci_data']},'secours')==='CSA Plateau - SEV-CI secours');
    ok('libelle chef principal', libelleFacteurMfa({isChef:true,permissions:['chef']},'principal')==='CSA Plateau - Médecin-Chef principal');
    ok('libelle chef secours', libelleFacteurMfa({isChef:true,permissions:['chef']},'secours')==='CSA Plateau - Médecin-Chef secours');
    ok('libelles distincts principal/secours', libelleFacteurMfa({isChef:true},'principal')!==libelleFacteurMfa({isChef:true},'secours'));
    ok('politique : maximum 2 facteurs', typeof MFA_MAX_FACTEURS==='number' && MFA_MAX_FACTEURS===2);
    ok('selection de facteur exposee', typeof mfaChoisirFacteur==='function');
    ok('message distinct: code incorrect', messageErreurMfa({code:'mfa_verification_failed'}).indexOf('incorrect')>-1);
    ok('message distinct: code expire', messageErreurMfa({code:'mfa_challenge_expired'}).indexOf('xpir')>-1);
    ok('message distinct: conflit de nom', messageErreurMfa({code:'mfa_factor_name_conflict'}).indexOf('cours')>-1);

    // ─── Scénarios MFA pilotés par un client Supabase simulé (P1..P10) ───
    const vraiSupa=supa;
    const F=(id,st,nom)=>({id:id,factor_type:'totp',status:st,friendly_name:nom||('CSA Plateau - SEV-CI '+(st==='verified'?'principal':'inachevee'))});
    function simuler(facteurs,opts){
      opts=opts||{};
      const appels={enroll:0,unenroll:0,dernierNom:null};
      supa={auth:{mfa:{
        getAuthenticatorAssuranceLevel:async()=>opts.aalErreur
          ? {data:null,error:opts.aalErreur}
          : {data:{currentLevel:opts.aal||'aal1'},error:null},
        listFactors:async()=>({data:facteurs,error:null}),
        enroll:async(a)=>{ appels.enroll++; appels.dernierNom=a.friendlyName;
          return opts.enrollErreur?{data:null,error:opts.enrollErreur}
            :{data:{id:'NOUVEAU',totp:{qr_code:'data:image/png;base64,AAAA',secret:'SECRET-SIMULE'}},error:null}; },
        unenroll:async()=>{ appels.unenroll++; return {error:null}; },
        challengeAndVerify:async()=>({error:null})
      }}};
      return appels;
    }
    CURRENT_AGENT={id:'T',nom:'T',role:'Test',module:'sevci',permissions:['sevci_data'],isChef:false};

    // P1 — aucun facteur
    let a=simuler({all:[],totp:[],phone:[]}); resetAuthLocks();
    await requireChiefMfa();
    ok('P1 etat = enrolement requis', MFA_STATE.etat===MFA_ETATS.ENROLEMENT_EN_COURS);
    ok('P1 exactement un enroll', a.enroll===1);
    ok('P1 aucun unenroll', a.unenroll===0);
    ok('P1 libelle principal SEV-CI', a.dernierNom==='CSA Plateau - SEV-CI principal');
    ok('P1 zone QR affichee', document.getElementById('mfa-qr-zone').style.display==='block');

    // P2 — un facteur non verifie
    a=simuler({all:[F('F1','unverified')],totp:[],phone:[]}); resetAuthLocks();
    await requireChiefMfa();
    ok('P2 etat = reprise possible', MFA_STATE.etat===MFA_ETATS.FACTEUR_NON_VERIFIE_REPRISE_POSSIBLE);
    ok('P2 AUCUN enroll', a.enroll===0);
    ok('P2 AUCUN unenroll', a.unenroll===0);
    ok('P2 ecran de choix affiche', document.getElementById('mfa-choice').style.display==='block');

    // P3 — reprise : challenge du facteur existant, aucun enrolement
    mfaReprendre();
    ok('P3 reprise -> challenge du meme facteur', MFA_STATE.factorId==='F1');
    ok('P3 reprise sans enroll', a.enroll===0 && a.unenroll===0);

    // P5 — un facteur verifie
    const fv=F('FV','verified');
    a=simuler({all:[fv],totp:[fv],phone:[]}); resetAuthLocks();
    await requireChiefMfa();
    ok('P5 challenge du facteur verifie', MFA_STATE.etat===MFA_ETATS.FACTEUR_VERIFIE_A_CHALLENGER && MFA_STATE.factorId==='FV');
    ok('P5 aucun enroll ni unenroll', a.enroll===0 && a.unenroll===0);

    // P6 — deux facteurs verifies
    const fa=F('FA','verified','CSA Plateau - SEV-CI principal'), fb=F('FB','verified','CSA Plateau - SEV-CI secours');
    a=simuler({all:[fa,fb],totp:[fa,fb],phone:[]}); resetAuthLocks();
    await requireChiefMfa();
    ok('P6 ecran de selection', MFA_STATE.etat===MFA_ETATS.CHOIX_FACTEUR_VERIFIE);
    ok('P6 deux methodes proposees', MFA_STATE.facteurs.length===2);
    ok('P6 AUCUNE selection silencieuse', !MFA_STATE.factorId);
    ok('P6 pas d avertissement de gestion', MFA_STATE.gestionRequise===false);
    ok('P6 liste DOM rendue', document.getElementById('mfa-select-list').children.length===2);
    mfaChoisirFacteur('FB');
    ok('P6 challenge du facteur choisi', MFA_STATE.factorId==='FB' && MFA_STATE.etat===MFA_ETATS.FACTEUR_VERIFIE_A_CHALLENGER);

    // P7 — plus de deux facteurs verifies
    const fc=F('FC','verified','CSA Plateau - SEV-CI tiers');
    a=simuler({all:[fa,fb,fc],totp:[fa,fb,fc],phone:[]}); resetAuthLocks();
    await requireChiefMfa();
    ok('P7 avertissement de gestion', MFA_STATE.gestionRequise===true);
    ok('P7 choix toujours possible', MFA_STATE.facteurs.length===3);
    ok('P7 AUCUNE suppression', a.unenroll===0 && a.enroll===0);

    // P8 — plusieurs facteurs non verifies
    a=simuler({all:[F('U1','unverified'),F('U2','unverified')],totp:[],phone:[]}); resetAuthLocks();
    await requireChiefMfa();
    ok('P8 redemarrage requis', MFA_STATE.etat===MFA_ETATS.FACTEUR_NON_VERIFIE_REDEMARRAGE_REQUIS);
    ok('P8 AUCUNE suppression automatique', a.unenroll===0);
    ok('P8 AUCUN enroll automatique', a.enroll===0);

    // P9 — double initialisation simultanee (single-flight)
    a=simuler({all:[],totp:[],phone:[]}); resetAuthLocks();
    await Promise.all([requireChiefMfa(),requireChiefMfa(),requireChiefMfa()]);
    ok('P9 un seul enroll malgre 3 appels simultanes', a.enroll===1);

    // AAL2 deja acquis
    a=simuler({all:[],totp:[],phone:[]},{aal:'aal2'}); resetAuthLocks();
    const rAal2=await requireChiefMfa();
    ok('AAL2 -> acces accorde', rAal2===true && MFA_STATE.etat===MFA_ETATS.AAL2_OK);
    ok('AAL2 -> aucun enroll', a.enroll===0);

    // Erreur reseau transitoire a l'entree initiale (ecran MFA non encore ouvert -> message sur l'ecran de connexion)
    document.getElementById('mfa-screen').style.display='none';   // simuler une entree fraiche
    document.getElementById('auth-error').textContent='';
    a=simuler({all:[],totp:[],phone:[]},{aalErreur:{message:'network timeout'}}); resetAuthLocks();
    const rNet=await requireChiefMfa();
    ok('reseau KO -> etat recuperable', MFA_STATE.etat===MFA_ETATS.ERREUR_RECUPERABLE);
    ok('reseau KO -> pas d acces', rNet===false);
    ok('reseau KO -> message reseau (ecran connexion)', document.getElementById('auth-error').textContent.indexOf('Réseau')>-1);
    ok('reseau KO -> aucun facteur touche', a.enroll===0 && a.unenroll===0);
    ok('reseau KO -> nouvel essai possible', document.getElementById('auth-submit').disabled===false);

    // Erreur MFA APRES ouverture de l'ecran MFA -> message sur l'ecran MFA, pas dans #auth-error cache (R2-A)
    document.getElementById('mfa-screen').style.display='flex';
    document.getElementById('auth-error').textContent='';
    document.getElementById('mfa-error').textContent='';
    a=simuler({all:[],totp:[],phone:[]},{aalErreur:{message:'network timeout'}}); resetAuthLocks();
    document.getElementById('mfa-screen').style.display='flex';   // resetAuthLocks ne touche pas l'affichage
    await requireChiefMfa();
    ok('erreur sur ecran MFA -> #mfa-error rempli', document.getElementById('mfa-error').textContent.length>0);
    ok('erreur sur ecran MFA -> #auth-error vide', document.getElementById('auth-error').textContent==='');

    // Conflit de nom -> bascule en reprise (et non en impasse)
    a=simuler({all:[F('FX','unverified')],totp:[],phone:[]},{enrollErreur:{code:'mfa_factor_name_conflict'}});
    resetAuthLocks();
    await enrolerNouveauFacteur('principal');
    ok('conflit -> bascule en reprise', MFA_STATE.etat===MFA_ETATS.FACTEUR_NON_VERIFIE_REPRISE_POSSIBLE);

    // P10 — deconnexion : verrous et DOM nettoyes
    document.getElementById('mfa-secret').textContent='Clé manuelle : SECRET-SIMULE';
    resetAuthLocks();
    ok('P10 verrous reinitialises', MFA_STATE===null);
    ok('P10 secret retire du DOM', document.getElementById('mfa-secret').textContent==='');
    ok('P10 QR retire du DOM', !document.getElementById('mfa-qr').getAttribute('src'));
    ok('P10 aucun secret en stockage local', Object.keys(localStorage).every(k=>String(localStorage.getItem(k)||'').indexOf('SECRET-SIMULE')===-1));

    supa=vraiSupa; CURRENT_AGENT=null;

    // ─── Synchro v2 : idempotence (client_event_id) ───
    ok('newClientEventId: format UUID v4', /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(newClientEventId()));
    ok('newClientEventId: 2 appels = 2 cles distinctes', newClientEventId()!==newClientEventId());

    // ─── Repli anti-outage : cache de schema PostgREST inconnu ───
    ok('csaIsCacheErr: code PGRST204 -> repli', csaIsCacheErr({code:'PGRST204'})===true);
    ok('csaIsCacheErr: message schema cache -> repli', csaIsCacheErr({message:"Could not find the 'client_event_id' column in the schema cache"})===true);
    ok('csaIsCacheErr: doublon 23505 -> PAS un cache err', csaIsCacheErr({code:'23505'})===false);
    ok('csaIsCacheErr: permission denied -> PAS un cache err', csaIsCacheErr({message:'permission denied'})===false);
    ok('csaStripCev retire client_event_id', csaStripCev({a:1,client_event_id:'x'}).client_event_id===undefined);
    ok('csaStripCev conserve les autres champs', csaStripCev({a:1,client_event_id:'x'}).a===1);
    { const src={client_event_id:'x'}; csaStripCev(src); ok('csaStripCev ne mute pas la source', src.client_event_id==='x'); }

    // ─── Commit atomique (csa_commit) : detection fonction absente -> repli per-row ───
    ok('csaIsMissingFn: PGRST202 -> repli per-row', csaIsMissingFn({code:'PGRST202'})===true);
    ok('csaIsMissingFn: message fonction absente -> repli per-row', csaIsMissingFn({message:'Could not find the function public.csa_commit'})===true);
    ok('csaIsMissingFn: cache err != fonction absente', csaIsMissingFn({code:'PGRST204'})===false);

    // ─── toCloudRow : propage la cle d'idempotence + forme de l'event ───
    { const r=toCloudRow({table:'transactions',item:{id:'T1',client_event_id:'CEV-1',created_at:'2026-06-30T00:00:00Z'}});
      ok('toCloudRow: client_event_id propage (SYNC_V2)', r.client_event_id==='CEV-1');
      ok('toCloudRow: event_key = table:id', r.event_key==='transactions:T1');
      ok('toCloudRow: payload.synced force a true', r.payload.synced===true);
      ok('toCloudRow: created_at preserve', r.created_at==='2026-06-30T00:00:00Z'); }

    // ─── Groupe atomique : une table MUTABLE ne rejoint JAMAIS un groupe (anti-ecrasement) ───
    ok('MUTABLE_TABLES contient pharma_stock', MUTABLE_TABLES.includes('pharma_stock'));
    { const savedQ=SYNC_Q.slice(), savedGrp=CSA_GROUP;
      try{
        CSA_GROUP='grp_test'; SYNC_Q=[];
        queueSync('pharma_mouvements',{id:'MV1'}); // immuable -> estampille
        queueSync('pharma_stock',{id:'ST1'});       // mutable -> jamais estampille
        const mv=SYNC_Q.find(o=>o.table==='pharma_mouvements');
        const st=SYNC_Q.find(o=>o.table==='pharma_stock');
        ok('groupe: event immuable estampille grp', !!mv && mv.grp==='grp_test');
        ok('groupe: table mutable JAMAIS estampillee', !!st && st.grp===undefined);
        ok('queueSync: chaque op recoit un client_event_id', !!mv && /[0-9a-f-]{36}/i.test(mv.item.client_event_id||''));
      } finally { SYNC_Q=savedQ; CSA_GROUP=savedGrp; localStorage.setItem('csa2_sq',JSON.stringify(SYNC_Q)); }
    }

    // ─── Stock jamais negatif (front) : FEFO + survente bloquee ───
    // Dates de peremption RELATIVES a l'annee courante (sinon le test devient
    // brittle : une date absolue finit par etre passee et fausse le FEFO).
    { const yr=new Date().getFullYear();
      const med={id:'Mx',nom:'X',stock:10};
      const lots=[{id:'L2',med_id:'Mx',quantite:5,date_peremption:(yr+3)+'-01-01',created_at:'b'},
                  {id:'L1',med_id:'Mx',quantite:5,date_peremption:(yr+2)+'-01-01',created_at:'a'}];
      const alloc=consumeLots(med,lots,3);
      ok('FEFO: consomme le lot perimant le plus tot en premier', alloc[0].lot_id==='L1'); }
    { const yr=new Date().getFullYear(); let threw=false;
      try{ consumeLots({id:'My',nom:'Y',stock:0},[{id:'L',med_id:'My',quantite:2,date_peremption:(yr+2)+'-01-01'}],10); }catch(e){ threw=true; }
      ok('Survente bloquee: consumeLots jette si lots insuffisants', threw===true); }

    // ─── Option B (stock dérivé) : deriveStock = stock_apres du dernier mouvement ───
    { const mvs=[
        {med_id:'A',stock_apres:'10',created_at:'2026-07-01T08:00:00Z'},
        {med_id:'A',stock_apres:'7', created_at:'2026-07-01T09:00:00Z'},
        {med_id:'B',stock_apres:'3', created_at:'2026-07-01T08:30:00Z'}];
      ok('deriveStock: solde = dernier stock_apres (med A -> 7)', deriveStock('A',mvs)===7);
      ok('deriveStock: med B -> 3', deriveStock('B',mvs)===3);
      ok('deriveStock: med sans mouvement -> 0', deriveStock('Z',mvs)===0); }

    // ─── Option B3 : stockOnlyDiff (auto-résolution faux conflit stock) ───
    { const base={id:'M1',nom:'Amox',code_produit:'AMX',px_cession:500,seuil:10,stock:20};
      const stockDiff={...base,stock:15,updated_at:'2026-08-05T10:00:00Z',entity_version:3};
      const priceDiff={...base,px_cession:600};
      ok('stockOnlyDiff: ne differe que par stock+bookkeeping -> true', stockOnlyDiff(base,stockDiff)===true);
      ok('stockOnlyDiff: differe par un prix -> false (vrai conflit)', stockOnlyDiff(base,priceDiff)===false);
      ok('stockOnlyDiff: payloads identiques -> true', stockOnlyDiff(base,{...base})===true);
      ok('stockOnlyDiff: payload manquant -> false', stockOnlyDiff(base,null)===false); }

    // ─── Tension artérielle : mmHg + notation cmHg locale, unité tolérée ───
    ok('parseTension: 120/80 -> 120/80', parseTension('120/80').ta==='120/80');
    ok('parseTension: cmHg 12/8 -> 120/80', parseTension('12/8').ta==='120/80');
    ok('parseTension: cmHg 13/9 -> 130/90', parseTension('13/9').ta==='130/90');
    ok('parseTension: unite mmHg toleree (130/85 mmHg)', parseTension('130/85 mmHg').ta==='130/85');
    ok('parseTension: separateur tiret 120-80', parseTension('120-80').ta==='120/80');
    ok('parseTension: aberrant -> null', parseTension('300/200')===null);
    ok('parseTension: non numerique -> null', parseTension('abc')===null);
  }catch(e){ ok('exception fatale: '+e.message, false); }
  return results;
})()`;

function render(results){
  const fails=results.filter(r=>!r.pass).length;
  const sum=document.getElementById('sum');
  sum.textContent=(fails===0?'✅ TOUS PASS':'❌ '+fails+' ECHEC(S)')+' — '+results.length+' tests';
  sum.className=fails===0?'pass':'fail';
  document.getElementById('list').innerHTML=results.map(r=>`<li class="${r.pass?'pass':'fail'}">${r.pass?'✔':'✗'} ${r.name}</li>`).join('');
  document.title=fails===0?'TESTS_PASS':'TESTS_FAIL';
  window.__TESTS__={total:results.length,fails:fails};
}
let __tries=0;
function tryRun(){
  __tries++;
  const w=document.getElementById('app').contentWindow;
  let ready=false;
  try{ ready = w && w.eval('typeof numFR==="function" && typeof VIEW!=="undefined"'); }catch(e){ ready=false; }
  if(ready){
    try{ Promise.resolve(w.eval(TEST_SRC))
           .then(render)
           .catch(e=>render([{name:"Echec asynchrone des tests: "+e.message,pass:false}])); }
    catch(e){ render([{name:"Impossible d'exécuter les tests: "+e.message,pass:false}]); }
    return;
  }
  if(__tries>50){ render([{name:'Application non chargée (timeout)',pass:false}]); return; }
  setTimeout(tryRun,200);
}
tryRun();
</script>
</body>
</html>
